services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse
    restart: unless-stopped
    group_add:
      - "1001"
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
      - "9440:9440"
      - "8443:8443"
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set in .env}
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init_estc.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./clickhouse/config.d/mtls.xml:/etc/clickhouse-server/config.d/mtls.xml:ro
      - ./clickhouse/users.d/estc_agent.xml:/etc/clickhouse-server/users.d/estc_agent.xml:ro
      - ./ssl/server.crt:/etc/clickhouse-server/certs/server.crt:ro
      - ./ssl/server.key:/etc/clickhouse-server/certs/server.key:ro
      - ./ssl/ca.crt:/etc/clickhouse-server/certs/ca.crt:ro

  map-server:
    image: python:3.12-slim
    container_name: network-map
    restart: unless-stopped
    working_dir: /opt/network_map/server
    command: ["python3", "server.py"]
    environment:
      MAP_PORT: "8085"
      MAP_OUTPUT_DIR: "/opt/network_map"
    expose:
      - "8085"
    volumes:
      - ./network_map:/opt/network_map:ro

  nginx:
    image: nginx:1.27-alpine
    container_name: network-map-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - /etc/ssl/certs:/etc/nginx/certs:ro
      - /etc/ssl/private:/etc/nginx/private:ro
    depends_on:
      - map-server

volumes:
  clickhouse_data:
